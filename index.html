                waZiyadah: "*تقرير الزيادة (حفظ جديد)*\n\n👤 الطالب: {nama}\n📖 الحفظ المسمع: ص {awal} إلى {akhir}\n📊 مستوى الحفظ: {juz} جزء\n\n_نسأل الله لك الثبات._",
                waTakrir: "*تقرير التكرار*\n\n👤 الطالب: {nama}\n✅ الربط (5 صفحات قبل الحفظ الجديد + الزيادة):\nص {awal} إلى {akhir}\n\n_تم التكرار._",
                waMurojaah: "*تقرير المراجعة*\n\n👤 الطالب: {nama}\n📚 المقدار الواجب: {beban}\n🎯 المسمع اليوم: {target}\n\n_تمت المراجعة اليومية._",
                waRiyadhoh: "*تقرير رياضة القرآن*\n\n👤 الطالب: {nama}\n📖 الهدف: تلاوة 30 جزء / يوم\n✅ التقدم: اليوم الـ {day} من 40 يوم\n\n_الحمد لله، نسأل الله الثبات._",
                waTasmi: "*تقرير تسميع 30 جزء*\n\n👤 الطالب: {nama}\n🎙️ جلسة واحدة لـ 30 جزء\n✅ التقدم: الاختبار الـ {count} من 3 مرات\n\n_بارك الله فيكم._",
                beban05: "نصف (0.5) جزء", beban1: "جزء كامل", beban2: "جزآن كاملان", beban3: "3 أجزاء كاملة",
                bebanHayat: "3 أجزاء كاملة (مراجعة مدى الحياة)"
            }
        };

        // DAFTAR KODE NEGARA LENGKAP
        const countryCodes = [
            { code: '62', label: '🇮🇩 Indonesia (+62)' }, { code: '967', label: '🇾🇪 Yemen (+967)' },
            { code: '966', label: '🇸🇦 Saudi Arabia (+966)' }, { code: '20', label: '🇪🇬 Egypt (+20)' },
            { code: '60', label: '🇲🇾 Malaysia (+60)' }, { code: '673', label: '🇧🇳 Brunei (+673)' },
            { code: '65', label: '🇸🇬 Singapore (+65)' }, { code: '971', label: '🇦🇪 UAE (+971)' },
            { code: '974', label: '🇶🇦 Qatar (+974)' }, { code: '965', label: '🇰🇼 Kuwait (+965)' },
            { code: '968', label: '🇴🇲 Oman (+968)' }, { code: '962', label: '🇯🇴 Jordan (+962)' },
            { code: '973', label: '🇧🇭 Bahrain (+973)' }, { code: '90', label: '🇹🇷 Turkey (+90)' },
            { code: '212', label: '🇲🇦 Morocco (+212)' }, { code: '213', label: '🇩🇿 Algeria (+213)' },
            { code: '92', label: '🇵🇰 Pakistan (+92)' }, { code: '880', label: '🇧🇩 Bangladesh (+880)' },
            { code: '91', label: '🇮🇳 India (+91)' }, { code: '44', label: '🇬🇧 UK (+44)' },
            { code: '1', label: '🇺🇸 US/Canada (+1)' }, { code: '61', label: '🇦🇺 Australia (+61)' }
        ];

        function App() {
            const [santriList, setSantriList] = useState([]);
            const [view, setView] = useState('home');
            const [activeSantri, setActiveSantri] = useState(null);
            const [waModal, setWaModal] = useState({ isOpen: false, text: '', penyimakWa: '', santriWa: '' });
            const [lang, setLang] = useState(localStorage.getItem('mutqinLang') || 'id');

            const t = locales[lang];
            const isRtl = lang === 'ar';

            useEffect(() => {
                const savedData = localStorage.getItem('mutqinDataV5');
                if (savedData) setSantriList(JSON.parse(savedData));
            }, []);

            useEffect(() => {
                localStorage.setItem('mutqinDataV5', JSON.stringify(santriList));
            }, [santriList]);

            useEffect(() => {
                localStorage.setItem('mutqinLang', lang);
            }, [lang]);

            const MAX_PAGES = 604;
            const MAX_JUZ = 30;

            const hitungJuzSekarang = (page) => Math.min(MAX_JUZ, Math.floor(page / 20));
            const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const handleRegister = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const hafalanAwalJuz = parseInt(formData.get('hafalanAwalJuz'));
                
                const newSantri = {
                    id: Date.now(),
                    nama: formData.get('nama'),
                    kodeNegaraPenyimak: formData.get('kodeNegaraPenyimak'),
                    noWaPenyimak: formData.get('noWaPenyimak').replace(/^0+/, ''),
                    kodeNegaraSantri: formData.get('kodeNegaraSantri'),
                    noWaSantri: formData.get('noWaSantri').replace(/^0+/, ''),
                    targetHarian: parseInt(formData.get('targetHarian')),
                    currentPage: Math.min(MAX_PAGES, hafalanAwalJuz * 20),
                    lastZiyadahAwal: Math.min(MAX_PAGES, hafalanAwalJuz * 20) + 1, 
                    currentMurojaahJuz: 1,
                    ujianPending: [], riyadhohDay: 0, tasmiCount: 0
                };
                setSantriList([...santriList, newSantri]);
                setView('home');
            };

            const handleDeleteSantri = (id) => {
                if(window.confirm(t.confirmHapus)) {
                    setSantriList(santriList.filter(s => s.id !== id));
                }
            };

            const generateUjianIkatan = (oldPage, newPage) => {
                const oldJuz = hitungJuzSekarang(oldPage);
                const newJuz = hitungJuzSekarang(newPage);
                let newUjians = [];
                if (newJuz > oldJuz && newJuz <= MAX_JUZ) {
                    for (let j = oldJuz + 1; j <= newJuz; j++) {
                        let baseDate = new Date();
                        let d1 = new Date(baseDate); d1.setDate(d1.getDate() + 10);
                        newUjians.push({ id: Date.now()+Math.random(), title: `1 Dudukan Juz ${j}`, type: 'Reguler', deadline: d1.toISOString() });
                        if (j % 5 === 0) {
                            let d2 = new Date(d1); d2.setDate(d2.getDate() + 5);
                            newUjians.push({ id: Date.now()+Math.random(), title: `1 Dudukan Juz ${j-4}-${j}`, type: 'Kelipatan 5', deadline: d2.toISOString() });
                            if (j >= 10) {
                                let d3 = new Date(d2); d3.setDate(d3.getDate() + 10);
                                newUjians.push({ id: Date.now()+Math.random(), title: `1 Dudukan Juz 1-${j}`, type: 'Akumulasi Besar', deadline: d3.toISOString() });
                            }
                        }
                    }
                }
                return newUjians;
            };

            const formatWaMsg = (template, vars) => {
                let msg = template;
                for (const key in vars) { msg = msg.replace(`{${key}}`, vars[key]); }
                return encodeURIComponent(msg);
            };

            const bukaModalWa = (santri, pesan) => {
                const kp = santri.kodeNegaraPenyimak || '62';
                const ks = santri.kodeNegaraSantri || '62';
                setWaModal({
                    isOpen: true, text: pesan,
                    penyimakWa: santri.noWaPenyimak ? `${kp}${santri.noWaPenyimak}` : '',
                    santriWa: santri.noWaSantri ? `${ks}${santri.noWaSantri}` : ''
                });
            };

            const laporZiyadah = (santri, halAwal, halAkhir) => {
                const finalAkhir = Math.min(MAX_PAGES, halAkhir);
                const txt = formatWaMsg(t.waZiyadah, { nama: santri.nama, awal: halAwal, akhir: finalAkhir, juz: hitungJuzSekarang(finalAkhir) });
                const newUjians = generateUjianIkatan(santri.currentPage, finalAkhir);
                
                const updatedList = santriList.map(s => {
                    if(s.id === santri.id) return { ...s, currentPage: finalAkhir, lastZiyadahAwal: halAwal, ujianPending: [...s.ujianPending, ...newUjians] };
                    return s;
                });
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santri.id));
                bukaModalWa(santri, txt);
            };

            const laporTakrir = (santri, takrirAwal, takrirAkhir) => {
                const txt = formatWaMsg(t.waTakrir, { nama: santri.nama, awal: takrirAwal, akhir: takrirAkhir });
                bukaModalWa(santri, txt);
            };

            const laporMurojaah = (santri, isKhatam) => {
                const juzSelesai = hitungJuzSekarang(santri.currentPage);
                let beban = t.beban05;
                let targetText = `${t.juz} ${santri.currentMurojaahJuz}`;
                let nextJuzState = santri.currentMurojaahJuz;

                if (isKhatam) {
                    beban = t.bebanHayat;
                    let j1 = santri.currentMurojaahJuz;
                    let j2 = (j1 + 1) > 30 ? (j1 + 1 - 30) : (j1 + 1);
                    let j3 = (j1 + 2) > 30 ? (j1 + 2 - 30) : (j1 + 2);
                    targetText = `${t.juz} ${j1}, ${j2}, ${t.dan} ${j3}`;
                    nextJuzState = (j1 + 3) > 30 ? (j1 + 3 - 30) : (j1 + 3);
                } else {
                    if (juzSelesai >= 5 && juzSelesai < 10) beban = t.beban1;
                    else if (juzSelesai >= 10 && juzSelesai < 20) beban = t.beban2;
                    else if (juzSelesai >= 20) beban = t.beban3;
                    nextJuzState = santri.currentMurojaahJuz + 1;
                    if (nextJuzState > juzSelesai) nextJuzState = 1; 
                }

                const txt = formatWaMsg(t.waMurojaah, { nama: santri.nama, beban: beban, target: targetText });
                const updatedList = santriList.map(s => {
                    if(s.id === santri.id) return { ...s, currentMurojaahJuz: nextJuzState };
                    return s;
                });
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santri.id));
                bukaModalWa(santri, txt);
            };

            const laporRiyadhoh = (santri) => {
                const nextDay = (santri.riyadhohDay || 0) + 1;
                const txt = formatWaMsg(t.waRiyadhoh, { nama: santri.nama, day: nextDay });
                const updatedList = santriList.map(s => { if(s.id === santri.id) return { ...s, riyadhohDay: nextDay }; return s; });
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santri.id));
                bukaModalWa(santri, txt);
            };

            const laporTasmi = (santri) => {
                const nextCount = (santri.tasmiCount || 0) + 1;
                const txt = formatWaMsg(t.waTasmi, { nama: santri.nama, count: nextCount });
                const updatedList = santriList.map(s => { if(s.id === santri.id) return { ...s, tasmiCount: nextCount }; return s; });
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santri.id));
                bukaModalWa(santri, txt);
            };

            const Header = () => (
                <div className="flex justify-between items-center mb-8">
                    <div className="flex items-center space-x-2 space-x-reverse">
                        <div className="bg-emerald-600 p-2 rounded-lg shadow-sm">
                            <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <h1 className={`text-2xl md:text-3xl font-extrabold text-emerald-800 tracking-tight ${isRtl ? 'mr-3' : 'ml-3'}`}>Mutqin<span className="text-emerald-500">Hafalan</span></h1>
                    </div>
                    <button onClick={() => setLang(lang === 'id' ? 'ar' : 'id')} className="bg-white border-2 border-emerald-500 text-emerald-700 font-bold px-3 py-1 rounded-lg hover:bg-emerald-50">
                        {lang === 'id' ? 'العربية' : 'Indonesia'}
                    </button>
                </div>
            );

            const SantriDetail = ({ santri }) => {
                const isKhatam = santri.currentPage >= MAX_PAGES;
                const juzSelesai = hitungJuzSekarang(santri.currentPage);
                
                const targetAwalZiyadah = santri.currentPage >= MAX_PAGES ? MAX_PAGES : santri.currentPage + 1;
                const targetAkhirZiyadah = Math.min(MAX_PAGES, santri.currentPage + santri.targetHarian);
                const [inputAwal, setInputAwal] = useState(targetAwalZiyadah);
                const [inputAkhir, setInputAkhir] = useState(targetAkhirZiyadah);

                const baseTakrir = santri.lastZiyadahAwal || (santri.currentPage > 0 ? santri.currentPage : 1);
                const takrirAwal = Math.max(1, baseTakrir - 5);
                const takrirAkhir = santri.currentPage;

                let m1 = santri.currentMurojaahJuz;
                let m2 = (m1 + 1) > 30 ? (m1 + 1 - 30) : (m1 + 1);
                let m3 = (m1 + 2) > 30 ? (m1 + 2 - 30) : (m1 + 2);

                return (
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border-t-8 border-emerald-600">
                        <button onClick={() => setView('home')} className="text-emerald-600 mb-6 font-bold flex items-center">{t.kembali}</button>
                        
                        <div className={`rounded-xl p-5 mb-6 border flex justify-between items-center ${isKhatam ? 'bg-yellow-50 border-yellow-200' : 'bg-emerald-50 border-emerald-100'}`}>
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800">{santri.nama}</h2>
                                <p className="text-emerald-700 font-medium">{t.capaian}: {juzSelesai} {t.juzPenuh} ({t.hal} {santri.currentPage}/{MAX_PAGES})</p>
                            </div>
                            {isKhatam && <div className="bg-yellow-400 text-yellow-900 font-bold px-3 py-1 rounded text-sm shadow-sm">{t.khatam}</div>}
                        </div>

                        {isKhatam ? (
                            <div className="space-y-5 animate-fade-in">
                                <h3 className="font-bold text-gray-800 text-lg mb-2 text-center border-b pb-2">{t.faseKhatam}</h3>
                                
                                <div className="bg-white border-2 border-indigo-100 rounded-xl p-5 shadow-sm">
                                    <span className="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded font-bold mb-3 inline-block">{t.riyadhohTitle}</span>
                                    <p className="text-gray-600 text-sm mb-3">{t.riyadhohDesc}</p>
                                    <div className="w-full bg-gray-200 rounded-full h-4 mb-4" dir="ltr">
                                        <div className="bg-indigo-600 h-4 rounded-full" style={{width: `${((santri.riyadhohDay || 0)/40)*100}%`}}></div>
                                    </div>
                                    <p className="font-bold text-indigo-800 mb-4 text-center">{t.hariKe}{(santri.riyadhohDay || 0)} / 40</p>
                                    <button onClick={() => laporRiyadhoh(santri)} disabled={(santri.riyadhohDay || 0) >= 40} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white py-3 rounded-lg font-bold shadow">{t.laporRiyadhoh}</button>
                                </div>

                                <div className="bg-white border-2 border-rose-100 rounded-xl p-5 shadow-sm">
                                    <span className="bg-rose-100 text-rose-800 text-xs px-2 py-1 rounded font-bold mb-3 inline-block">{t.tasmiTitle}</span>
                                    <p className="text-gray-600 text-sm mb-3">{t.tasmiDesc}</p>
                                    <p className="font-bold text-rose-800 mb-4 text-center">{t.putaranLulus} {(santri.tasmiCount || 0)} / 3</p>
                                    <button onClick={() => laporTasmi(santri)} disabled={(santri.tasmiCount || 0) >= 3} className="w-full bg-rose-600 hover:bg-rose-700 disabled:bg-gray-400 text-white py-3 rounded-lg font-bold shadow">{t.laporTasmi}</button>
                                </div>

                                <div className="bg-white border-2 border-purple-200 rounded-xl p-5 shadow-sm">
                                    <span className="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded font-bold mb-3 inline-block">{t.murojaahHayatTitle}</span>
                                    <p className="text-gray-600 text-sm mb-3">{t.murojaahHayatDesc}</p>
                                    <div className="bg-purple-50 p-4 rounded text-center mb-4 border border-purple-100">
                                        <p className="text-xs text-purple-600 font-bold uppercase tracking-wider mb-1">{t.targetDisetor}</p>
                                        <p className="font-bold text-purple-800 text-2xl" dir="ltr">{t.juz} {m1}, {m2}, {t.dan} {m3}</p>
                                    </div>
                                    <button onClick={() => laporMurojaah(santri, true)} className="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg font-bold shadow">{t.laporMurojaahHayat}</button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-5">
                                {santri.ujianPending.length > 0 && (
                                    <div className="bg-red-50 border-2 border-red-200 rounded-xl p-5">
                                        <h3 className="font-bold text-red-800 mb-3">{t.ujianIkatan}</h3>
                                        <div className="space-y-2">
                                            {santri.ujianPending.map(u => (
                                                <div key={u.id} className="flex justify-between items-center bg-white p-3 rounded shadow-sm border border-red-100">
                                                    <div>
                                                        <p className="font-bold text-gray-800" dir="ltr">{u.title}</p>
                                                        <p className="text-xs text-red-600">{t.maks}: {formatDate(u.deadline)}</p>
                                                    </div>
                                                    <button onClick={() => {
                                                        const s = [...santriList];
                                                        const idx = s.findIndex(x => x.id === santri.id);
                                                        s[idx].ujianPending = s[idx].ujianPending.filter(x => x.id !== u.id);
                                                        setSantriList(s); setActiveSantri(s[idx]);
                                                    }} className="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-2 rounded">{t.lulus}</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="bg-white border-2 border-blue-100 rounded-xl p-5 shadow-sm">
                                    <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold mb-3 inline-block">{t.ziyadahTitle}</span>
                                    <form onSubmit={(e) => { e.preventDefault(); laporZiyadah(santri, parseInt(inputAwal), parseInt(inputAkhir)); }} className="flex flex-col gap-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-xs font-bold text-gray-600">{t.halAwal}</label>
                                                <input type="number" value={inputAwal} onChange={(e)=>setInputAwal(e.target.value)} required min="1" max={MAX_PAGES} className="w-full border rounded p-2 bg-gray-50 font-bold" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-gray-600">{t.halAkhir} ({t.maks} {MAX_PAGES})</label>
                                                <input type="number" value={inputAkhir} onChange={(e)=>setInputAkhir(e.target.value)} required min={inputAwal} max={MAX_PAGES} className="w-full border border-blue-300 rounded p-2 bg-blue-50 font-bold text-blue-800" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold text-sm shadow">{t.simpanZiyadah}</button>
                                    </form>
                                </div>

                                <div className="bg-white border-2 border-amber-100 rounded-xl p-5 shadow-sm">
                                    <span className="bg-amber-100 text-amber-800 text-xs px-2 py-1 rounded font-bold mb-2 inline-block">{t.takrirTitle}</span>
                                    <p className="text-gray-600 text-xs mb-3">{t.takrirDesc} ({t.hal} {santri.lastZiyadahAwal} - {santri.currentPage})</p>
                                    <div className="bg-amber-50 border border-amber-200 p-3 rounded text-center mb-3">
                                        <p className="font-bold text-amber-800 text-lg" dir="ltr">{t.hal} {takrirAwal} - {takrirAkhir}</p>
                                    </div>
                                    <button onClick={() => laporTakrir(santri, takrirAwal, takrirAkhir)} disabled={santri.currentPage === 0} className="w-full bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-lg font-bold text-sm shadow disabled:bg-gray-300">{t.laporTakrir}</button>
                                </div>

                                <div className="bg-white border-2 border-purple-100 rounded-xl p-5 shadow-sm flex justify-between items-center gap-4">
                                    <div>
                                        <span className="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded font-bold inline-block mb-1">{t.murojaahTitle}</span>
                                        <p className="font-bold text-purple-800 text-lg">{t.juz} {juzSelesai === 0 ? `1 (${t.batasHafalan})` : santri.currentMurojaahJuz}</p>
                                    </div>
                                    <button onClick={() => laporMurojaah(santri, false)} className="whitespace-nowrap bg-purple-600 hover:bg-purple-700 text-white px-5 py-3 rounded-lg font-bold text-sm shadow">{t.lapor}</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div dir={isRtl ? 'rtl' : 'ltr'} className={`min-h-screen p-4 md:p-8 max-w-4xl mx-auto pb-24 ${isRtl ? 'text-right' : 'text-left'}`}>
                    <Header />

                    {view === 'register' && (
                        <div className="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-emerald-500 max-w-lg mx-auto">
                            <button onClick={() => setView('home')} className="text-emerald-600 mb-4 font-bold flex items-center">{t.kembali}</button>
                            <h2 className="text-2xl font-bold text-gray-800 mb-6">{t.regSantri}</h2>
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div><label className="block text-sm font-semibold mb-1">{t.namaLengkap}</label><input type="text" name="nama" required className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                
                                <div className="border p-3 rounded-lg bg-gray-50 space-y-3">
                                    <p className="font-bold text-sm text-gray-600 border-b pb-1">{t.kontakPenyimak}</p>
                                    <div className="flex gap-2">
                                        <select name="kodeNegaraPenyimak" className="border rounded-lg p-2 w-1/3 bg-white" dir="ltr">
                                            {countryCodes.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
                                        </select>
                                        <input type="tel" name="noWaPenyimak" placeholder="812..." className="w-2/3 border rounded-lg p-2 bg-white" dir="ltr" />
                                    </div>
                                </div>

                                <div className="border p-3 rounded-lg bg-gray-50 space-y-3">
                                    <p className="font-bold text-sm text-gray-600 border-b pb-1">{t.kontakSantri}</p>
                                    <div className="flex gap-2">
                                        <select name="kodeNegaraSantri" className="border rounded-lg p-2 w-1/3 bg-white" dir="ltr">
                                            {countryCodes.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
                                        </select>
                                        <input type="tel" name="noWaSantri" placeholder="813..." className="w-2/3 border rounded-lg p-2 bg-white" dir="ltr" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-sm font-semibold mb-1">{t.hafalanAwal}</label><input type="number" name="hafalanAwalJuz" min="0" max="30" defaultValue="0" className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                    <div><label className="block text-sm font-semibold mb-1">{t.targetHarian}</label><input type="number" name="targetHarian" min="1" defaultValue="1" className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg mt-4 shadow-md">{t.simpanSantri}</button>
                            </form>
                        </div>
                    )}

                    {view === 'detail' && activeSantri && <SantriDetail santri={activeSantri} />}

                    {view === 'home' && (
                        <div>
                            <div className="flex justify-between items-end mb-6">
                                <div><h2 className="text-2xl font-bold text-gray-800">{t.daftarSantri}</h2></div>
                                <button onClick={() => setView('register')} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold shadow-md">{t.addSantri}</button>
                            </div>
                            {santriList.length === 0 ? (
                                <div className="bg-white rounded-xl p-10 text-center shadow border text-gray-500">{t.noData}</div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {santriList.map((santri) => (
                                        <div key={santri.id} className="bg-white rounded-xl p-5 shadow-sm border border-emerald-100 relative">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-lg text-gray-800">{santri.nama}</h3>
                                                <button onClick={() => handleDeleteSantri(santri.id)} className="text-red-500 hover:bg-red-50 px-2 py-1 rounded text-xs font-bold transition-colors">
                                                    {t.hapus} 🗑️
                                                </button>
                                            </div>
                                            
                                            {santri.ujianPending && santri.ujianPending.length > 0 && <span className={`absolute -top-2 ${isRtl ? '-left-2' : '-right-2'} bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full animate-pulse`}>{santri.ujianPending.length}</span>}
                                            
                                            <p className="text-sm text-emerald-600 font-semibold mb-4">
                                                {santri.currentPage >= MAX_PAGES ? t.khatam : `${t.selesai} ${hitungJuzSekarang(santri.currentPage)} ${t.juz}`}
                                            </p>
                                            <button onClick={() => { setActiveSantri(santri); setView('detail'); }} className={`w-full text-emerald-700 border border-emerald-200 py-2 rounded-lg font-bold text-sm ${santri.currentPage >= MAX_PAGES ? 'bg-yellow-100' : 'bg-emerald-50'}`}>
                                                {santri.currentPage >= MAX_PAGES ? t.bukaPanelKhatam : t.bukaPanelSetoran}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* MODAL POPUP WA */}
                    {waModal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-xl mb-2">{t.pilihTujuanWa}</h3>
                                <p className="text-gray-600 text-sm mb-6">{t.pilihTujuanDesc}</p>
                                
                                <div className="space-y-3">
                                    <button disabled={!waModal.penyimakWa} onClick={() => window.open(`https://wa.me/${waModal.penyimakWa}?text=${waModal.text}`, '_blank')} className={`w-full font-bold py-3 px-4 rounded-lg flex justify-between items-center ${waModal.penyimakWa ? 'bg-green-500 hover:bg-green-600 text-white' : 'bg-gray-200 text-gray-500 cursor-not-allowed'}`}>
                                        <span>{t.penyimak}</span> <span>{waModal.penyimakWa ? '➔' : t.belumAdaWa}</span>
                                    </button>
                                    <button disabled={!waModal.santriWa} onClick={() => window.open(`https://wa.me/${waModal.santriWa}?text=${waModal.text}`, '_blank')} className={`w-full font-bold py-3 px-4 rounded-lg flex justify-between items-center ${waModal.santriWa ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-gray-200 text-gray-500 cursor-not-allowed'}`}>
                                        <span>{t.santri}</span> <span>{waModal.santriWa ? '➔' : t.belumAdaWa}</span>
                                    </button>
                                </div>
                                
                                <button onClick={() => setWaModal({ isOpen: false, text: '', penyimakWa: '', santriWa: '' })} className="mt-4 w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 rounded-lg">{t.tutup}</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
