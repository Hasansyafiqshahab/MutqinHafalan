                    let baseDate = new Date();
                    let d1 = new Date(baseDate); d1.setDate(d1.getDate() + 10);
                    newUjians.push({ id: Date.now() + Math.random(), title: `1 Dudukan Juz ${j}`, type: 'Reguler', deadline: d1.toISOString() });
                    if (j % 5 === 0) {
                        let d2 = new Date(d1); d2.setDate(d2.getDate() + 5);
                        newUjians.push({ id: Date.now() + Math.random(), title: `1 Dudukan Juz ${j-4}-${j}`, type: 'Kelipatan 5', deadline: d2.toISOString() });
                        if (j >= 10) {
                            let d3 = new Date(d2); d3.setDate(d3.getDate() + 10);
                            newUjians.push({ id: Date.now() + Math.random(), title: `1 Dudukan Juz 1-${j}`, type: 'Akumulasi Besar', deadline: d3.toISOString() });
                        }
                    }
                }
            }
            return newUjians;
        }

        function toggleLang() {
            state.lang = state.lang === 'id' ? 'ar' : 'id';
            saveState();
            render();
        }

        function setView(v, santriId = null) {
            state.view = v;
            state.activeSantriId = santriId;
            render();
        }

        function deleteSantri(id) {
            const t = locales[state.lang];
            if (window.confirm(t.confirmHapus)) {
                state.santriList = state.santriList.filter(s => s.id !== id);
                saveState();
                render();
            }
        }

        function bukaModalWa(santri, pesan) {
            const kp = santri.kodeNegaraPenyimak || '62';
            const ks = santri.kodeNegaraSantri || '62';
            state.waModal = {
                isOpen: true,
                text: pesan,
                penyimakWa: santri.noWaPenyimak ? `${kp}${santri.noWaPenyimak}` : '',
                santriWa: santri.noWaSantri ? `${ks}${santri.noWaSantri}` : ''
            };
            render();
        }

        function closeWaModal() {
            state.waModal = { isOpen: false, text: '', penyimakWa: '', santriWa: '' };
            render();
        }

        function lulusUjian(santriId, ujianId) {
            state.santriList = state.santriList.map(s => {
                if (s.id === santriId) {
                    return { ...s, ujianPending: s.ujianPending.filter(u => u.id !== ujianId) };
                }
                return s;
            });
            saveState();
            render();
        }

        function actionZiyadah(e, santriId) {
            e.preventDefault();
            const t = locales[state.lang];
            const santri = state.santriList.find(s => s.id === santriId);
            const halAwal = parseInt(document.getElementById('inputAwal').value);
            const halAkhir = parseInt(document.getElementById('inputAkhir').value);
            if (halAkhir < halAwal) return;

            const finalAkhir = Math.min(MAX_PAGES, halAkhir);
            const txt = formatWaMsg(t.waZiyadah, { nama: santri.nama, awal: halAwal, akhir: finalAkhir, juz: hitungJuzSekarang(finalAkhir) });
            const newUjians = generateUjianIkatan(santri.currentPage, finalAkhir);

            state.santriList = state.santriList.map(s => {
                if (s.id === santriId) return { ...s, currentPage: finalAkhir, lastZiyadahAwal: halAwal, ujianPending: [...(s.ujianPending || []), ...newUjians] };
                return s;
            });
            saveState();
            bukaModalWa(santri, txt);
        }

        function actionTakrir(santriId, takrirAwal, takrirAkhir) {
            const t = locales[state.lang];
            const santri = state.santriList.find(s => s.id === santriId);
            const txt = formatWaMsg(t.waTakrir, { nama: santri.nama, awal: takrirAwal, akhir: takrirAkhir });
            bukaModalWa(santri, txt);
        }

        function actionMurojaah(santriId, isKhatam) {
            const t = locales[state.lang];
            const santri = state.santriList.find(s => s.id === santriId);
            const juzSelesai = hitungJuzSekarang(santri.currentPage);
            let beban = t.beban05;
            let targetText = `${t.juz} ${santri.currentMurojaahJuz}`;
            let nextJuzState = santri.currentMurojaahJuz;

            if (isKhatam) {
                beban = t.bebanHayat;
                let j1 = santri.currentMurojaahJuz;
                let j2 = (j1 + 1) > 30 ? (j1 + 1 - 30) : (j1 + 1);
                let j3 = (j1 + 2) > 30 ? (j1 + 2 - 30) : (j1 + 2);
                targetText = `${t.juz} ${j1}, ${j2}, ${t.dan} ${j3}`;
                nextJuzState = (j1 + 3) > 30 ? (j1 + 3 - 30) : (j1 + 3);
            } else {
                if (juzSelesai >= 5 && juzSelesai < 10) beban = t.beban1;
                else if (juzSelesai >= 10 && juzSelesai < 20) beban = t.beban2;
                else if (juzSelesai >= 20) beban = t.beban3;
                nextJuzState = santri.currentMurojaahJuz + 1;
                if (nextJuzState > juzSelesai) nextJuzState = 1;
            }

            const txt = formatWaMsg(t.waMurojaah, { nama: santri.nama, beban: beban, target: targetText });
            state.santriList = state.santriList.map(s => {
                if (s.id === santriId) return { ...s, currentMurojaahJuz: nextJuzState };
                return s;
            });
            saveState();
            bukaModalWa(santri, txt);
        }

        function actionRiyadhoh(santriId) {
            const t = locales[state.lang];
            const santri = state.santriList.find(s => s.id === santriId);
            const nextDay = (santri.riyadhohDay || 0) + 1;
            const txt = formatWaMsg(t.waRiyadhoh, { nama: santri.nama, day: nextDay });
            state.santriList = state.santriList.map(s => s.id === santriId ? { ...s, riyadhohDay: nextDay } : s);
            saveState();
            bukaModalWa(santri, txt);
        }

        function actionTasmi(santriId) {
            const t = locales[state.lang];
            const santri = state.santriList.find(s => s.id === santriId);
            const nextCount = (santri.tasmiCount || 0) + 1;
            const txt = formatWaMsg(t.waTasmi, { nama: santri.nama, count: nextCount });
            state.santriList = state.santriList.map(s => s.id === santriId ? { ...s, tasmiCount: nextCount } : s);
            saveState();
            bukaModalWa(santri, txt);
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const f = e.target;
            const hafalanAwalJuz = parseInt(f.hafalanAwalJuz.value) || 0;
            const newSantri = {
                id: Date.now(),
                nama: f.nama.value,
                kodeNegaraPenyimak: f.kodeNegaraPenyimak.value,
                noWaPenyimak: f.noWaPenyimak.value.replace(/^0+/, ''),
                kodeNegaraSantri: f.kodeNegaraSantri.value,
                noWaSantri: f.noWaSantri.value.replace(/^0+/, ''),
                targetHarian: parseInt(f.targetHarian.value) || 1,
                currentPage: Math.min(MAX_PAGES, hafalanAwalJuz * 20),
                lastZiyadahAwal: Math.min(MAX_PAGES, hafalanAwalJuz * 20) + 1,
                currentMurojaahJuz: 1,
                ujianPending: [], riyadhohDay: 0, tasmiCount: 0
            };
            state.santriList.push(newSantri);
            saveState();
            setView('home');
        }

        function render() {
            const t = locales[state.lang];
            const isRtl = state.lang === 'ar';
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            const app = document.getElementById('app');

            let html = `
                <div class="header">
                    <div class="brand">
                        <div class="brand-icon">
                            <svg width="28" height="28" fill="none" stroke="#ffffff" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <h1 class="brand-title">Mutqin<span>Hafalan</span></h1>
                    </div>
                    <button class="btn-lang" onclick="toggleLang()">${state.lang === 'id' ? 'العربية' : 'Indonesia'}</button>
                </div>
            `;

            if (state.view === 'home') {
                html += `
                    <div class="top-bar">
                        <h2 class="section-title">${t.daftarSantri}</h2>
                        <button class="btn btn-emerald" onclick="setView('register')">${t.addSantri}</button>
                    </div>
                `;
                if (state.santriList.length === 0) {
                    html += `<div class="empty-box">${t.noData}</div>`;
                } else {
                    html += `<div class="grid-cards">`;
                    state.santriList.forEach(s => {
                        const isKhatam = s.currentPage >= MAX_PAGES;
                        const ujianCount = (s.ujianPending || []).length;
                        html += `
                            <div class="card">
                                ${ujianCount > 0 ? `<span class="badge-ujian">${ujianCount}</span>` : ''}
                                <div class="card-header">
                                    <h3 class="santri-name">${s.nama}</h3>
                                    <button class="btn-delete" onclick="deleteSantri(${s.id})">${t.hapus} 🗑️</button>
                                </div>
                                <p class="santri-status">${isKhatam ? t.khatam : `${t.selesai} ${hitungJuzSekarang(s.currentPage)} ${t.juz}`}</p>
                                <button class="btn ${isKhatam ? 'btn-khatam-card' : 'btn-outline-emerald'}" onclick="setView('detail', ${s.id})">
                                    ${isKhatam ? t.bukaPanelKhatam : t.bukaPanelSetoran}
                                </button>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            } else if (state.view === 'register') {
                const optionsHtml = countryCodes.map(c => `<option value="${c.code}">${c.label}</option>`).join('');
                html += `
                    <div class="panel-card">
                        <button class="btn-back" onclick="setView('home')">${t.kembali}</button>
                        <h2 class="section-title" style="margin-bottom:20px;">${t.regSantri}</h2>
                        <form onsubmit="handleRegisterSubmit(event)">
                            <div class="form-group">
                                <label class="form-label">${t.namaLengkap}</label>
                                <input type="text" name="nama" required class="form-input" />
                            </div>
                            <div class="contact-box">
                                <p class="contact-title">${t.kontakPenyimak}</p>
                                <div class="flex-row" dir="ltr">
                                    <select name="kodeNegaraPenyimak" class="form-select" style="width:40%;">${optionsHtml}</select>
                                    <input type="tel" name="noWaPenyimak" placeholder="812..." class="form-input" style="width:60%;" />
                                </div>
                            </div>
                            <div class="contact-box">
                                <p class="contact-title">${t.kontakSantri}</p>
                                <div class="flex-row" dir="ltr">
                                    <select name="kodeNegaraSantri" class="form-select" style="width:40%;">${optionsHtml}</select>
                                    <input type="tel" name="noWaSantri" placeholder="813..." class="form-input" style="width:60%;" />
                                </div>
                            </div>
                            <div class="grid-2" style="margin-bottom:20px;">
                                <div>
                                    <label class="form-label">${t.hafalanAwal}</label>
                                    <input type="number" name="hafalanAwalJuz" min="0" max="30" value="0" class="form-input" />
                                </div>
                                <div>
                                    <label class="form-label">${t.targetHarian}</label>
                                    <input type="number" name="targetHarian" min="1" value="1" class="form-input" />
                                </div>
                            </div>
                            <button type="submit" class="btn btn-emerald" style="width:100%; padding:14px;">${t.simpanSantri}</button>
                        </form>
                    </div>
                `;
            } else if (state.view === 'detail') {
                const santri = state.santriList.find(s => s.id === state.activeSantriId);
                if (!santri) { setView('home'); return; }
                const isKhatam = santri.currentPage >= MAX_PAGES;
                const juzSelesai = hitungJuzSekarang(santri.currentPage);
                const targetAwalZiyadah = isKhatam ? MAX_PAGES : santri.currentPage + 1;
                const targetAkhirZiyadah = Math.min(MAX_PAGES, santri.currentPage + santri.targetHarian);
                const baseTakrir = santri.lastZiyadahAwal || (santri.currentPage > 0 ? santri.currentPage : 1);
                const takrirAwal = Math.max(1, baseTakrir - 5);
                const takrirAkhir = santri.currentPage;

                let m1 = santri.currentMurojaahJuz;
                let m2 = (m1 + 1) > 30 ? (m1 + 1 - 30) : (m1 + 1);
                let m3 = (m1 + 2) > 30 ? (m1 + 2 - 30) : (m1 + 2);

                html += `
                    <div class="panel-card">
                        <button class="btn-back" onclick="setView('home')">${t.kembali}</button>
                        <div class="info-banner ${isKhatam ? 'khatam' : ''}">
                            <div>
                                <h2 class="section-title">${santri.nama}</h2>
                                <p style="color:#047857; font-weight:600; font-size:14px;">${t.capaian}: ${juzSelesai} ${t.juzPenuh} (${t.hal} ${santri.currentPage}/${MAX_PAGES})</p>
                            </div>
                            ${isKhatam ? `<div class="badge-khatam">${t.khatam}</div>` : ''}
                        </div>
                `;

                if (isKhatam) {
                    const rDay = santri.riyadhohDay || 0;
                    const tCount = santri.tasmiCount || 0;
                    html += `
                        <h3 style="text-align:center; font-weight:700; margin-bottom:16px; border-bottom:1px solid #e5e7eb; padding-bottom:8px;">${t.faseKhatam}</h3>
                        <div class="box-section box-indigo">
                            <span class="tag tag-indigo">${t.riyadhohTitle}</span>
                            <p style="font-size:13px; color:#4b5563;">${t.riyadhohDesc}</p>
                            <div class="progress-bar-bg" dir="ltr">
                                <div class="progress-bar-fill" style="width:${(rDay/40)*100}%"></div>
                            </div>
                            <p style="text-align:center; font-weight:700; color:#3730a3; margin-bottom:12px;">${t.hariKe}${rDay} / 40</p>
                            <button class="btn btn-indigo" onclick="actionRiyadhoh(${santri.id})" ${rDay >= 40 ? 'disabled' : ''}>${t.laporRiyadhoh}</button>
                        </div>

                        <div class="box-section box-rose">
                            <span class="tag tag-rose">${t.tasmiTitle}</span>
                            <p style="font-size:13px; color:#4b5563; margin-bottom:10px;">${t.tasmiDesc}</p>
                            <p style="text-align:center; font-weight:700; color:#9f1239; margin-bottom:12px;">${t.putaranLulus} ${tCount} / 3</p>
                            <button class="btn btn-rose" onclick="actionTasmi(${santri.id})" ${tCount >= 3 ? 'disabled' : ''}>${t.laporTasmi}</button>
                        </div>

                        <div class="box-section box-purple">
                            <span class="tag tag-purple">${t.murojaahHayatTitle}</span>
                            <p style="font-size:13px; color:#4b5563;">${t.murojaahHayatDesc}</p>
                            <div class="highlight-purple">
                                <p style="font-size:11px; font-weight:700; color:#7e22ce; text-transform:uppercase;">${t.targetDisetor}</p>
                                <p style="font-size:22px; font-weight:800; color:#581c87;" dir="ltr">${t.juz} ${m1}, ${m2}, ${t.dan} ${m3}</p>
                            </div>
                            <button class="btn btn-purple" style="width:100%;" onclick="actionMurojaah(${santri.id}, true)">${t.laporMurojaahHayat}</button>
                        </div>
                    `;
                } else {
                    if (santri.ujianPending && santri.ujianPending.length > 0) {
                        html += `<div class="box-section box-red"><h3 style="color:#991b1b; font-size:15px; font-weight:700; margin-bottom:8px;">${t.ujianIkatan}</h3>`;
                        santri.ujianPending.forEach(u => {
                            html += `
                                <div class="ujian-item">
                                    <div>
                                        <p style="font-weight:700; font-size:14px;" dir="ltr">${u.title}</p>
                                        <p style="font-size:12px; color:#dc2626;">${t.maks}: ${formatDate(u.deadline)}</p>
                                    </div>
                                    <button class="btn-red-sm" onclick="lulusUjian(${santri.id}, ${u.id})">${t.lulus}</button>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }

                    html += `
                        <div class="box-section box-blue">
                            <span class="tag tag-blue">${t.ziyadahTitle}</span>
                            <form onsubmit="actionZiyadah(event, ${santri.id})">
                                <div class="grid-2" style="margin-bottom:14px;">
                                    <div>
                                        <label class="form-label">${t.halAwal}</label>
                                        <input type="number" id="inputAwal" value="${targetAwalZiyadah}" min="1" max="${MAX_PAGES}" required class="form-input" style="font-weight:700;" />
                                    </div>
                                    <div>
                                        <label class="form-label">${t.halAkhir} (${t.maks} ${MAX_PAGES})</label>
                                        <input type="number" id="inputAkhir" value="${targetAkhirZiyadah}" min="1" max="${MAX_PAGES}" required class="form-input" style="font-weight:700; border-color:#93c5fd; background:#eff6ff; color:#1e40af;" />
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-blue">${t.simpanZiyadah}</button>
                            </form>
                        </div>

                        <div class="box-section box-amber">
                            <span class="tag tag-amber">${t.takrirTitle}</span>
                            <p style="font-size:12px; color:#4b5563;">${t.takrirDesc} (${t.hal} ${santri.lastZiyadahAwal} - ${santri.currentPage})</p>
                            <div class="highlight-box" dir="ltr">${t.hal} ${takrirAwal} - ${takrirAkhir}</div>
                            <button class="btn btn-amber" onclick="actionTakrir(${santri.id}, ${takrirAwal}, ${takrirAkhir})" ${santri.currentPage === 0 ? 'disabled' : ''}>${t.laporTakrir}</button>
                        </div>

                        <div class="box-section box-purple" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
                            <div>
                                <span class="tag tag-purple">${t.murojaahTitle}</span>
                                <p style="font-weight:700; color:#581c87; font-size:18px;">${t.juz} ${juzSelesai === 0 ? `1 (${t.batasHafalan})` : santri.currentMurojaahJuz}</p>
                            </div>
                            <button class="btn btn-purple" onclick="actionMurojaah(${santri.id}, false)">${t.lapor}</button>
                        </div>
                    `;
                }
                html += `</div>`;
            }

            if (state.waModal.isOpen) {
                const pWa = state.waModal.penyimakWa;
                const sWa = state.waModal.santriWa;
                html += `
                    <div class="modal-overlay">
                        <div class="modal-card">
                            <h3 style="font-size:19px; font-weight:700; margin-bottom:6px;">${t.pilihTujuanWa}</h3>
                            <p style="font-size:13px; color:#4b5563; margin-bottom:20px;">${t.pilihTujuanDesc}</p>
                            <button class="btn btn-wa-1" ${!pWa ? 'disabled' : ''} onclick="window.open('https://wa.me/${pWa}?text=${state.waModal.text}', '_blank')">
                                <span>${t.penyimak}</span>
                                <span>${pWa ? '➔' : t.belumAdaWa}</span>
                            </button>
                            <button class="btn btn-wa-2" ${!sWa ? 'disabled' : ''} onclick="window.open('https://wa.me/${sWa}?text=${state.waModal.text}', '_blank')">
                                <span>${t.santri}</span>
                                <span>${sWa ? '➔' : t.belumAdaWa}</span>
                            </button>
                            <button class="btn btn-close" onclick="closeWaModal()">${t.tutup}</button>
                        </div>
                    </div>
                `;
            }

            app.innerHTML = html;
        }

        render();
    </script>
</body>
</html>
