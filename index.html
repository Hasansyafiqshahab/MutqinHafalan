<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutqin Tracker Pro v2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0fdf4; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AppLogo = () => (
            <div className="flex items-center justify-center space-x-2 mb-6">
                <svg className="w-10 h-10 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <h1 className="text-3xl font-extrabold text-emerald-800 tracking-tight">Mutqin<span className="text-emerald-500">Tracker</span></h1>
            </div>
        );

        function App() {
            const [santriList, setSantriList] = useState([]);
            const [view, setView] = useState('home');
            const [activeSantri, setActiveSantri] = useState(null);
            
            // State untuk modal WA
            const [waModal, setWaModal] = useState({ isOpen: false, text: '', penyimakWa: '', santriWa: '' });

            useEffect(() => {
                const savedData = localStorage.getItem('mutqinDataV2');
                if (savedData) setSantriList(JSON.parse(savedData));
            }, []);

            useEffect(() => {
                localStorage.setItem('mutqinDataV2', JSON.stringify(santriList));
            }, [santriList]);

            // Helper Konversi & Kalkulasi
            const hitungJuzSekarang = (page) => Math.floor(page / 20); // 1 Juz = 20 Hal
            const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            const handleRegister = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const hafalanAwalJuz = parseInt(formData.get('hafalanAwalJuz'));
                
                const newSantri = {
                    id: Date.now(),
                    nama: formData.get('nama'),
                    kodeNegara: formData.get('kodeNegara'),
                    noWaPenyimak: formData.get('noWaPenyimak').replace(/^0+/, ''),
                    noWaSantri: formData.get('noWaSantri').replace(/^0+/, ''),
                    targetHarian: parseInt(formData.get('targetHarian')),
                    currentPage: hafalanAwalJuz * 20,
                    currentMurojaahJuz: 1,
                    ujianPending: [] // Tempat menampung ujian dudukan ikatan
                };

                setSantriList([...santriList, newSantri]);
                setView('home');
            };

            // LOGIKA PENCIPTAAN UJIAN IKATAN SAAT TEMBUS JUZ BARU
            const generateUjianIkatan = (oldPage, newPage) => {
                const oldJuz = Math.floor(oldPage / 20);
                const newJuz = Math.floor(newPage / 20);
                let newUjians = [];
                
                if (newJuz > oldJuz) {
                    for (let j = oldJuz + 1; j <= newJuz; j++) {
                        let baseDate = new Date();
                        
                        // Ujian 1: 1 Dudukan Juz itu sendiri (Max 10 Hari)
                        let d1 = new Date(baseDate); d1.setDate(d1.getDate() + 10);
                        newUjians.push({ id: Date.now()+Math.random(), title: `1 Dudukan Juz ${j}`, type: 'Reguler', deadline: d1.toISOString() });
                        
                        // Ujian 2 & 3: Kelipatan 5 Juz
                        if (j % 5 === 0) {
                            let d2 = new Date(d1); d2.setDate(d2.getDate() + 5);
                            newUjians.push({ id: Date.now()+Math.random(), title: `1 Dudukan Juz ${j-4}-${j}`, type: 'Kelipatan 5', deadline: d2.toISOString() });
                            
                            if (j >= 10) {
                                let d3 = new Date(d2); d3.setDate(d3.getDate() + 10);
                                newUjians.push({ id: Date.now()+Math.random(), title: `1 Dudukan Juz 1-${j}`, type: 'Akumulasi Besar', deadline: d3.toISOString() });
                            }
                        }
                    }
                }
                return newUjians;
            };

            const bukaModalWa = (santri, pesan) => {
                setWaModal({
                    isOpen: true,
                    text: encodeURIComponent(pesan),
                    penyimakWa: `${santri.kodeNegara}${santri.noWaPenyimak}`,
                    santriWa: `${santri.kodeNegara}${santri.noWaSantri}`
                });
            };

            const laporZiyadah = (santri, halAwal, halAkhir) => {
                const text = `*LAPORAN ZIYADAH & TAKRIR*\n\n👤 Santri: ${santri.nama}\n📖 Ziyadah Baru: Hal ${halAwal} s/d ${halAkhir}\n✅ Takrir (5 Hal Mundur + Ziyadah): Hal ${Math.max(1, halAwal - 5)} s/d ${halAkhir}\n📊 Posisi Hafalan: ${hitungJuzSekarang(halAkhir)} Juz\n\n_Semoga Allah berikan keistiqomahan._`;
                
                const newUjians = generateUjianIkatan(santri.currentPage, halAkhir);
                
                const updatedList = santriList.map(s => {
                    if(s.id === santri.id) {
                        return { ...s, currentPage: halAkhir, ujianPending: [...s.ujianPending, ...newUjians] };
                    }
                    return s;
                });
                
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santri.id));
                bukaModalWa(santri, text);
            };

            const laporMurojaah = (santri) => {
                const juzSelesai = hitungJuzSekarang(santri.currentPage);
                let beban = "Setengah (0.5) Juz";
                if (juzSelesai >= 5 && juzSelesai < 10) beban = "1 Juz Penuh";
                else if (juzSelesai >= 10 && juzSelesai < 20) beban = "2 Juz Penuh";
                else if (juzSelesai >= 20) beban = "3 Juz Penuh";

                const targetJuz = santri.currentMurojaahJuz;
                const text = `*LAPORAN MUROJAAH BERURUTAN*\n\n👤 Santri: ${santri.nama}\n📚 Porsi Wajib: ${beban}\n🎯 Disetor hari ini: Juz ${targetJuz}\n\n_Alhamdulillah murojaah harian selesai._`;
                
                const updatedList = santriList.map(s => {
                    if(s.id === santri.id) {
                        let nextJuz = s.currentMurojaahJuz + 1;
                        if (nextJuz > hitungJuzSekarang(s.currentPage)) nextJuz = 1; 
                        return { ...s, currentMurojaahJuz: nextJuz };
                    }
                    return s;
                });
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santri.id));
                bukaModalWa(santri, text);
            };

            const selesaikanUjian = (santriId, ujianId) => {
                const updatedList = santriList.map(s => {
                    if(s.id === santriId) {
                        return { ...s, ujianPending: s.ujianPending.filter(u => u.id !== ujianId) };
                    }
                    return s;
                });
                setSantriList(updatedList);
                setActiveSantri(updatedList.find(s => s.id === santriId));
            };


            // --- KOMPONEN PANEL DETAIL SANTRI ---
            const SantriDetail = ({ santri }) => {
                const juzSelesai = hitungJuzSekarang(santri.currentPage);
                
                // Form State Ziyadah
                const [inputAwal, setInputAwal] = useState(santri.currentPage + 1);
                const [inputAkhir, setInputAkhir] = useState(santri.currentPage + santri.targetHarian);

                const handleZiyadahSubmit = (e) => {
                    e.preventDefault();
                    if(inputAkhir < inputAwal) return alert("Halaman akhir tidak boleh kurang dari halaman awal!");
                    laporZiyadah(santri, parseInt(inputAwal), parseInt(inputAkhir));
                };

                return (
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border-t-8 border-emerald-600">
                        <button onClick={() => setView('home')} className="text-emerald-600 mb-6 font-bold flex items-center">← Kembali ke Dashboard</button>
                        
                        <div className="bg-emerald-50 rounded-xl p-5 mb-6 border border-emerald-100">
                            <h2 className="text-2xl font-bold text-gray-800">{santri.nama}</h2>
                            <p className="text-emerald-700 font-medium">Capaian Saat Ini: {juzSelesai} Juz Penuh (Selesai Hal {santri.currentPage})</p>
                        </div>

                        {/* SECTION 1: IKATAN / UJIAN (Hanya tampil jika ada ujian) */}
                        {santri.ujianPending.length > 0 && (
                            <div className="mb-6 bg-red-50 border-2 border-red-200 rounded-xl p-5">
                                <h3 className="font-bold text-red-800 mb-3 flex items-center gap-2">⚠️ Tanggungan Ujian Ikatan Juz</h3>
                                <div className="space-y-2">
                                    {santri.ujianPending.map(u => (
                                        <div key={u.id} className="flex justify-between items-center bg-white p-3 rounded shadow-sm border border-red-100">
                                            <div>
                                                <p className="font-bold text-gray-800">{u.title} <span className="text-xs font-normal bg-red-100 text-red-600 px-2 py-0.5 rounded ml-1">{u.type}</span></p>
                                                <p className="text-xs text-red-600">Maks. Selesai: {formatDate(u.deadline)}</p>
                                            </div>
                                            <button onClick={() => selesaikanUjian(santri.id, u.id)} className="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-2 rounded">
                                                Tandai Lulus ✓
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="space-y-5">
                            {/* SECTION 2: ZIYADAH & TAKRIR */}
                            <div className="bg-white border-2 border-blue-100 rounded-xl p-5 shadow-sm">
                                <div className="flex items-center gap-2 mb-3">
                                    <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">1. SETORAN ZIYADAH & TAKRIR</span>
                                </div>
                                <form onSubmit={handleZiyadahSubmit} className="flex flex-col gap-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-gray-600">Mulai Halaman</label>
                                            <input type="number" value={inputAwal} onChange={(e)=>setInputAwal(e.target.value)} required className="w-full border rounded p-2 bg-gray-50 font-bold" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-600">Sampai Halaman</label>
                                            <input type="number" value={inputAkhir} onChange={(e)=>setInputAkhir(e.target.value)} required min={inputAwal} className="w-full border border-blue-300 focus:ring-blue-500 rounded p-2 bg-blue-50 font-bold text-blue-800" />
                                        </div>
                                    </div>
                                    <div className="bg-gray-50 p-3 rounded border text-sm text-gray-600">
                                        💡 <b>Target Takrir Otomatis:</b> Hal {Math.max(1, inputAwal - 5)} s/d {inputAkhir}
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold text-sm shadow transition-colors">
                                        Simpan Progres & Buka Laporan WA
                                    </button>
                                </form>
                            </div>

                            {/* SECTION 3: MUROJAAH LAMA */}
                            <div className="bg-white border-2 border-purple-100 rounded-xl p-5 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className="bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded font-bold">2. MUROJAAH BERURUTAN</span>
                                    </div>
                                    <p className="text-gray-600 text-sm mt-2">Target Murojaah Hari Ini:</p>
                                    <p className="font-bold text-purple-800 text-lg">Juz {juzSelesai === 0 ? "1 (Batas Hafalan)" : santri.currentMurojaahJuz}</p>
                                </div>
                                <button onClick={() => laporMurojaah(santri)} className="w-full md:w-auto bg-purple-600 hover:bg-purple-700 text-white px-5 py-3 rounded-lg font-bold text-sm shadow transition-colors">
                                    Lapor Murojaah ➔
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto pb-24">
                    <AppLogo />

                    {view === 'register' && (
                        <div className="bg-white p-8 rounded-2xl shadow-xl border-t-8 border-emerald-500 max-w-lg mx-auto">
                            <button onClick={() => setView('home')} className="text-emerald-600 mb-4 font-bold flex items-center">← Kembali</button>
                            <h2 className="text-2xl font-bold text-gray-800 mb-6">Registrasi Santri Baru</h2>
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div><label className="block text-sm font-semibold">Nama Lengkap</label><input type="text" name="nama" required className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                
                                <div><label className="block text-sm font-semibold">Kode Negara WA</label>
                                    <select name="kodeNegara" className="w-full border rounded-lg p-2 bg-gray-50">
                                        <option value="62">🇮🇩 Indonesia (+62)</option><option value="967">🇾🇪 Yaman (+967)</option>
                                    </select>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-sm font-semibold">WA Penyimak</label><input type="tel" name="noWaPenyimak" placeholder="812..." required className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                    <div><label className="block text-sm font-semibold">WA Santri</label><input type="tel" name="noWaSantri" placeholder="813..." required className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="block text-sm font-semibold">Hafalan Awal (Juz)</label><input type="number" name="hafalanAwalJuz" min="0" max="30" defaultValue="0" className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                    <div><label className="block text-sm font-semibold">Target (Hal/Hari)</label><input type="number" name="targetHarian" min="1" defaultValue="1" className="w-full border rounded-lg p-2 bg-gray-50" /></div>
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg mt-4 shadow-md">Simpan Santri</button>
                            </form>
                        </div>
                    )}

                    {view === 'detail' && activeSantri && <SantriDetail santri={activeSantri} />}

                    {view === 'home' && (
                        <div>
                            <div className="flex justify-between items-end mb-6">
                                <div><h2 className="text-2xl font-bold text-gray-800">Daftar Santri</h2></div>
                                <button onClick={() => setView('register')} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold shadow-md">+ Tambah Santri</button>
                            </div>
                            {santriList.length === 0 ? (
                                <div className="bg-white rounded-xl p-10 text-center shadow border text-gray-500">Belum ada data. Silakan tambah santri.</div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {santriList.map((santri) => (
                                        <div key={santri.id} className="bg-white rounded-xl p-5 shadow-sm border border-emerald-100 relative">
                                            {santri.ujianPending.length > 0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full animate-pulse">{santri.ujianPending.length} Ujian</span>}
                                            <h3 className="font-bold text-lg text-gray-800">{santri.nama}</h3>
                                            <p className="text-sm text-emerald-600 font-semibold mb-4">Selesai: {hitungJuzSekarang(santri.currentPage)} Juz</p>
                                            <button onClick={() => { setActiveSantri(santri); setView('detail'); }} className="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-2 rounded-lg font-bold text-sm">Buka Panel Setoran ➔</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* MODAL POPUP WA CERDAS */}
                    {waModal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-xl mb-2">Laporan Disimpan! 🎉</h3>
                                <p className="text-gray-600 text-sm mb-6">Pilih tujuan pengiriman laporan ke WhatsApp:</p>
                                
                                <div className="space-y-3">
                                    <button onClick={() => window.open(`https://wa.me/${waModal.penyimakWa}?text=${waModal.text}`, '_blank')} className="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg flex justify-between items-center">
                                        <span>Kirim ke Penyimak</span> <span>➔</span>
                                    </button>
                                    <button onClick={() => window.open(`https://wa.me/${waModal.santriWa}?text=${waModal.text}`, '_blank')} className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex justify-between items-center">
                                        <span>Kirim ke Santri</span> <span>➔</span>
                                    </button>
                                </div>
                                
                                <button onClick={() => setWaModal({ isOpen: false, text: '', penyimakWa: '', santriWa: '' })} className="mt-4 w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 rounded-lg">
                                    Tutup
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
